[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
# Railway runs startCommand WITHOUT a shell, so a compound "a; b" breaks (node
# gets "scripts/…;" as a filename and nothing serves). The genesis seed runs via
# the npm `prestart` hook (package.json), which npm sequences before `start` — so
# a plain "npm start" here both seeds and starts, no shell needed.
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.volumes]
"/data" = {}
